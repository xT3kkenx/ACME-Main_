
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACME - Nueva venta</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

  <header class="main-header">

<a href="inicio.html" class="header-logo">
  <img src="../img/logo-acme.png" alt="Logo de Comercializadora ACME S.A.S.">
</a>

    <button class="menu-toggle" aria-label="Abrir menú">☰</button>

    <nav class="main-nav">
      <ul>
        <li><a href="inicio.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="clientes.html">Clientes</a></li>
        <li><a href="proveedores.html">Proveedores</a></li>
        <li><a href="ordenes.html">Órdenes</a></li>
        <li><a href="ventas.html">Ventas</a></li>
        <li><a href="compras.html">Compras</a></li>
        <li><a href="reportes.html">Reportes</a></li>
        <li><a href="../index.html">Cerrar sesión</a></li>
      </ul>
    </nav>

  </header>

  <main class="page-container">

    <section>

      <h2>Formulario nueva venta</h2>

      <div class="form-container">

        <form id="form-venta" action="#" method="post">

          <div class="form-row">

            <div class="form-group">
              <label for="cliente">Cliente</label>
              <input
                type="text"
                id="cliente"
                name="cliente"
                placeholder="Ingrese el cliente"
                required
              >
            </div>

            <div class="form-group">
              <label for="fecha">Fecha</label>
              <input
                type="date"
                id="fecha"
                name="fecha"
                required
              >
            </div>

          </div>

          <div class="form-group">
            <label for="producto">Producto</label>
            <input
              type="text"
              id="producto"
              name="producto"
              placeholder="Ingrese el producto"
              required
            >
          </div>

          <div class="form-row">

            <div class="form-group">
              <label for="valor">Valor unitario</label>
              <input
                type="number"
                id="valor"
                name="valor"
                min="0"
                step="0.01"
                placeholder="0.00"
                required
              >
            </div>

            <div class="form-group">
              <label for="cantidad">Cantidad</label>
              <input
                type="number"
                id="cantidad"
                name="cantidad"
                min="1"
                placeholder="1"
                required
              >
            </div>

          </div>

          <div class="form-group">
            <label for="total">Total de venta</label>
            <input
              type="number"
              id="total"
              name="total"
              min="0"
              step="0.01"
              placeholder="0.00"
              required
            >
          </div>

          <div class="form-row">

            <button id="btn-guardar" type="submit" class="btn-primary">
              Registrar venta
            </button>

            <button type="button" class="btn-secondary">
              Cancelar
            </button>

          </div>

        </form>

      </div>

    </section>

  </main>

  <script>
    const toggle = document.querySelector('.menu-toggle');
    const nav = document.querySelector('.main-nav');

    toggle.addEventListener('click', () => {
      nav.classList.toggle('active');
    });
  </script>

  <!-- ALMACENAMIENTO Y FUNCIONALIDAD DEL FORMULARIO -->

  <script src="../js/storage.js"></script>
  <script src="../js/venta-form.js"></script>

</body>
</html>
