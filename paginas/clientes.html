
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ACME - Clientes</title>

  <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

  <!-- ENCABEZADO Y MENÚ PRINCIPAL -->

  <header class="main-header">

<a href="inicio.html" class="header-logo">
  <img src="../img/logo-acme.png" alt="Logo de Comercializadora ACME S.A.S.">
</a>

    <button class="menu-toggle" aria-label="Abrir menú">
      ☰
    </button>

    <nav class="main-nav">
      <ul>
        <li><a href="inicio.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="clientes.html">Clientes</a></li>
        <li><a href="proveedores.html">Proveedores</a></li>
        <li><a href="ordenes.html">Órdenes</a></li>
        <li><a href="ventas.html">Ventas</a></li>
        <li><a href="compras.html">Compras</a></li>
        <li><a href="reportes.html">Reportes</a></li>
        <li><a href="../index.html">Cerrar sesión</a></li>
      </ul>
    </nav>

  </header>


  <!-- CONTENIDO PRINCIPAL-->

  <main class="page-container">

    <section>

      <h2>Lista de clientes</h2>

      <!-- BOTÓN NUEVO CLIENTE -->

      <p>
        <a href="nuevo-cliente.html" class="btn-primary">
          Nuevo cliente
        </a>
      </p>

    </section>


    <!-- TABLA DE CLIENTES-->

    <!-- BUSCADOR: permite filtrar los registros en tiempo real. -->

    <section>

      <div class="form-group buscador-group">

        <label for="buscador-clientes">Buscar cliente</label>

        <input
          type="search"
          id="buscador-clientes"
          placeholder="Buscar por nombre, apellido, correo o teléfono...">

      </div>

    </section>


    <section>

      <div class="table-container">

        <table id="tabla-clientes">

          <thead>
            <tr>
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Dirección</th>
              <th>Correo</th>
              <th>Teléfono</th>
            </tr>
          </thead>

          <tbody>
            <!-- Las filas se generan desde JavaScript usando localStorage. -->
          </tbody>

        </table>

      </div>

    </section>

  </main>


  <!-- FUNCIONALIDAD DEL MENÚ RESPONSIVO -->

  <script>

    const toggle = document.querySelector('.menu-toggle');
    const nav = document.querySelector('.main-nav');

    toggle.addEventListener('click', () => {
      nav.classList.toggle('active');
    });

  </script>

  <!-- ALMACENAMIENTO Y FUNCIONALIDAD DE ESTA TABLA -->

  <script src="../js/storage.js"></script>
  <script src="../js/clientes.js"></script>

</body>

</html>
