
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ACME - Nueva orden</title>

  <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

  <!-- ENCABEZADO Y MENÚ PRINCIPAL -->

  <header class="main-header">

<a href="inicio.html" class="header-logo">
  <img src="../img/logo-acme.png" alt="Logo de Comercializadora ACME S.A.S.">
</a>

    <button class="menu-toggle" aria-label="Abrir menú">
      ☰
    </button>

    <nav class="main-nav">
      <ul>
        <li><a href="inicio.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="clientes.html">Clientes</a></li>
        <li><a href="proveedores.html">Proveedores</a></li>
        <li><a href="ordenes.html">Órdenes</a></li>
        <li><a href="ventas.html">Ventas</a></li>
        <li><a href="compras.html">Compras</a></li>
        <li><a href="reportes.html">Reportes</a></li>
        <li><a href="../index.html">Cerrar sesión</a></li>
      </ul>
    </nav>

  </header>


  <!-- CONTENIDO PRINCIPAL -->

  <main class="page-container">

    <section>

      <h2>Formulario nueva orden de trabajo</h2>

      <div class="form-container">

        <form id="form-orden" action="#" method="post">

          <!-- CLIENTE -->

          <div class="form-group">

            <label for="cliente">Cliente</label>

            <input
              type="text"
              id="cliente"
              name="cliente"
              placeholder="Ingrese el cliente"
              required>

          </div>


          <!-- RESPONSABLE -->

          <div class="form-group">

            <label for="responsable">Responsable</label>

            <input
              type="text"
              id="responsable"
              name="responsable"
              placeholder="Ingrese el responsable"
              required>

          </div>


          <!-- MÉTODO DE PAGO -->

          <div class="form-group">

            <label for="metodo">Método de pago</label>

            <select id="metodo" name="metodo" required>

              <option value="">Seleccione un método de pago</option>
              <option value="efectivo">Efectivo</option>
              <option value="tarjeta">Tarjeta</option>
              <option value="transferencia">Transferencia</option>

            </select>

          </div>


          <!-- ESTADO -->

          <div class="form-group">

            <label for="estado">Estado de la orden</label>

            <select id="estado" name="estado" required>

              <option value="">Seleccione el estado</option>
              <option value="proceso">En proceso</option>
              <option value="terminada">Terminada</option>

            </select>

          </div>


          <!-- PRODUCTO -->

          <div class="form-group">

            <label for="producto">Producto</label>

            <input
              type="text"
              id="producto"
              name="producto"
              placeholder="Ingrese el producto"
              required>

          </div>


          <!-- VALOR UNITARIO -->

          <div class="form-group">

            <label for="valor">Valor unitario</label>

            <input
              type="number"
              id="valor"
              name="valor"
              min="0"
              step="0.01"
              placeholder="0.00"
              required>

          </div>


          <!-- CANTIDAD -->

          <div class="form-group">

            <label for="cantidad">Cantidad</label>

            <input
              type="number"
              id="cantidad"
              name="cantidad"
              min="1"
              placeholder="Ingrese la cantidad"
              required>

          </div>


          <!-- TOTAL -->

          <div class="form-group">

            <label for="total">Total de venta</label>

            <input
              type="number"
              id="total"
              name="total"
              min="0"
              step="0.01"
              placeholder="0.00"
              required>

          </div>


          <!-- BOTONES -->

          <div class="form-row">

            <button id="btn-guardar" type="submit" class="btn-primary">
              Generar orden
            </button>

            <button type="button" class="btn-secondary">
              Cancelar
            </button>

          </div>

        </form>

      </div>

    </section>

  </main>


  <!-- FUNCIONALIDAD DEL MENÚ RESPONSIVO -->

  <script>

    const toggle = document.querySelector('.menu-toggle');
    const nav = document.querySelector('.main-nav');

    toggle.addEventListener('click', () => {
      nav.classList.toggle('active');
    });

  </script>

  <!-- ALMACENAMIENTO Y FUNCIONALIDAD DEL FORMULARIO -->

  <script src="../js/storage.js"></script>
  <script src="../js/orden-form.js"></script>

</body>

</html>
